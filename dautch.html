<body class="antialiased">

    <div class="mystic-bg animate-pulse-glow"></div>
    <div id="root" class="relative z-10 w-full min-h-screen flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ==========================================
        // MOTOR DE AUDIO (WEB AUDIO API)
        // ==========================================
        let audioCtx = null;
        let masterGain = null;
        let delayNode = null;
        let feedbackGain = null;
        const activeOscillators = {};
        const MAX_TIMER_DELAY = 2147480000;
        const TIME_MULTIPLIERS = { seconds: 1, minutes: 60, hours: 3600 };

        const toSeconden = (value, unit) => {
            const numericValue = Number(value);
            if (!Number.isFinite(numericValue) || numericValue < 0) return 0;
            return numericValue * TIME_MULTIPLIERS[unit];
        };

        const formatDuur = (seconds) => {
            if (!Number.isFinite(seconds) || seconds <= 0) return '0 sec';
            if (seconds >= 3600) return `${(seconds / 3600).toFixed(2)} uur`;
            if (seconds >= 60) return `${(seconds / 60).toFixed(2)} min`;
            return `${seconds.toFixed(seconds % 1 ? 1 : 0)} sec`;
        };

        // Handles long sessions without the browser's single-timer limit.
        const scheduleLongTimer = (delayMs, callback) => {
            let cancelled = false;
            let timerId = null;

            const scheduleChunk = (remainingMs) => {
                if (cancelled) return;
                const chunk = Math.min(Math.max(remainingMs, 0), MAX_TIMER_DELAY);
                timerId = window.setTimeout(() => {
                    if (cancelled) return;
                    if (remainingMs > chunk) scheduleChunk(remainingMs - chunk);
                    else callback();
                }, chunk);
            };

            scheduleChunk(Math.max(delayMs, 0));
            return () => {
                cancelled = true;
                if (timerId !== null) window.clearTimeout(timerId);
            };
        };

        const initAudioEngine = () => {
            if (audioCtx) return;
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.5; // Master volume
            
            // Ether effect (long delay to simulate a church/cathedral ambience)
            delayNode = audioCtx.createDelay(2.0);
            delayNode.delayTime.value = 0.6; // Echo time in seconds
            
            feedbackGain = audioCtx.createGain();
            feedbackGain.gain.value = 0.4; // Echo amount
            
            delayNode.connect(feedbackGain);
            feedbackGain.connect(delayNode);
            
            delayNode.connect(masterGain);
            masterGain.connect(audioCtx.destination);
        };

        const playFrequentie = (freq) => {
            if (!audioCtx) initAudioEngine();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine'; // Experimental sine wave
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Envelope attack (smooth, safe start)
            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.3);

            osc.connect(gain);
            gain.connect(masterGain);
            gain.connect(delayNode); // Send to effect
            
            osc.start();
            const voice = { osc, gain };
            if (!activeOscillators[freq]) activeOscillators[freq] = [];
            activeOscillators[freq].push(voice);
            return voice;
        };

        const stopVoice = (freq, voice) => {
            const voices = activeOscillators[freq];
            if (!voices || !voice) return;
            const voiceIndex = voices.indexOf(voice);
            if (voiceIndex === -1) return;
            const { osc, gain } = voice;
            
            // Envelope release (long fade-out)
            const releaseAt = audioCtx.currentTime + 3.0;
            gain.gain.cancelScheduledValues(audioCtx.currentTime);
            gain.gain.setValueAtTime(Math.max(gain.gain.value, 0.001), audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, releaseAt);
            
            osc.stop(releaseAt);
            voices.splice(voiceIndex, 1);
            if (voices.length === 0) delete activeOscillators[freq];
        };

        const stopFrequentie = (freq) => {
            [...(activeOscillators[freq] || [])].forEach((voice) => stopVoice(freq, voice));
        };

        // ==========================================
        // SOLFEGGIO FREQUENCY DATABASE
        // ==========================================
        const FREQUENCIES = [
            { freq: 396, note: 'Wortel', objective: 'Geluidsverkenning en ademhaling', key: 'a', color: '#ef4444' },
            { freq: 417, note: 'Sacraal', objective: 'Omgevingsverandering en textuur', key: 's', color: '#f97316' },
            { freq: 528, note: 'Zonnevlecht', objective: 'Experimentele toon van 528 Hz', key: 'd', color: '#fbbf24' },
            { freq: 639, note: 'Hart', objective: 'Luisteren en persoonlijke verbinding', key: 'f', color: '#10b981' },
            { freq: 741, note: 'Keel', objective: 'Studie van timbre en expressie', key: 'g', color: '#0ea5e9' },
            { freq: 852, note: 'Derde oog', objective: 'Aandacht en innerlijk luisteren', key: 'h', color: '#6366f1' },
            { freq: 963, note: 'Kruin', objective: 'Contemplatieve geluidservaring', key: 'j', color: '#b026ff' }
        ];

        // ==========================================
        // MAIN COMPONENT
        // ==========================================
        const SynthApp = () => {
            const [engineStarted, setEngineStarted] = useState(false);
            const [activeKeys, setActiveKeys] = useState({}); // { freq: boolean }
            const [playlist, setPlaylist] = useState([]);
            const [selectedFrequentie, setSelectedFrequentie] = useState(FREQUENCIES[0].freq);
            const [startValue, setStartValue] = useState('0');
            const [startUnit, setStartUnit] = useState('seconds');
            const [durationValue, setDuurValue] = useState('5');
            const [durationUnit, setDuurUnit] = useState('minutes');
            const [automationRunning, setAutomationRunning] = useState(false);
            const [automationActive, setAutomationActive] = useState([]);
            const [automationElapsed, setAutomationElapsed] = useState(0);
            const [automationNotice, setAutomationNotice] = useState('');
            const manualVoicesRef = useRef({});
            const automationTimersRef = useRef(new Map());
            const automationVoicesRef = useRef(new Map());
            const automationRunRef = useRef(false);
            const automationPendingRef = useRef(0);
            const automationElapsedTimerRef = useRef(null);
            const automationStartedAtRef = useRef(0);

            const getPad = (freq) => FREQUENCIES.find((pad) => pad.freq === Number(freq));

            const startManualFrequentie = (freq) => {
                if (!engineStarted || manualVoicesRef.current[freq]) return;
                manualVoicesRef.current[freq] = playFrequentie(freq);
                setActiveKeys(prev => ({ ...prev, [freq]: true }));
            };

            const releaseManualFrequentie = (freq) => {
                stopVoice(freq, manualVoicesRef.current[freq]);
                delete manualVoicesRef.current[freq];
                setActiveKeys(prev => ({ ...prev, [freq]: false }));
            };
            
            // Keyboard shortcuts
            useEffect(() => {
                if (!engineStarted) return;

                const handleKeyDown = (e) => {
                    if (e.repeat) return;
                    const key = e.key.toLowerCase();
                    const pad = FREQUENCIES.find(f => f.key === key);
                    if (pad) {
                        startManualFrequentie(pad.freq);
                    }
                };

                const handleKeyUp = (e) => {
                    const key = e.key.toLowerCase();
                    const pad = FREQUENCIES.find(f => f.key === key);
                    if (pad) {
                        releaseManualFrequentie(pad.freq);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);

                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                };
            }, [engineStarted]);

            // Mouse / touch handlers
            const handlePadDown = (freq) => {
                startManualFrequentie(freq);
            };

            const handlePadUp = (freq) => {
                releaseManualFrequentie(freq);
            };

            const startEngine = () => {
                initAudioEngine();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                setEngineStarted(true);
            };

            const trackStartSeconden = (track) => toSeconden(track.startValue, track.startUnit);
            const trackDuurSeconden = (track) => toSeconden(track.durationValue, track.durationUnit);
            const geplandDuurSeconden = playlist.length
                ? Math.max(...playlist.map(track => trackStartSeconden(track) + trackDuurSeconden(track)))
                : 0;

            const updateTrack = (id, field, value) => {
                setPlaylist(prev => prev.map(track => track.id === id ? { ...track, [field]: value } : track));
            };

            const removeTrack = (id) => {
                if (automationRunning) return;
                setPlaylist(prev => prev.filter(track => track.id !== id));
            };

            const clearPlaylist = () => {
                if (automationRunning) return;
                setPlaylist([]);
                setAutomationNotice('Tijdlijn gewist.');
            };

            const addTrack = (appendToTimeline = false) => {
                const selectedPad = getPad(selectedFrequentie);
                if (!selectedPad) return;

                const durationSeconden = toSeconden(durationValue, durationUnit);
                if (durationSeconden <= 0) {
                    setAutomationNotice('Kies een duur die groter is dan nul.');
                    return;
                }

                const sequentialStartSeconden = appendToTimeline && playlist.length
                    ? Math.max(...playlist.map(track => trackStartSeconden(track) + trackDuurSeconden(track)))
                    : 0;
                const track = {
                    id: `track-${Date.now()}-${Math.random().toString(36).slice(2)}`,
                    freq: selectedPad.freq,
                    startValue: appendToTimeline ? String(sequentialStartSeconden) : startValue,
                    startUnit: appendToTimeline ? 'seconds' : startUnit,
                    durationValue,
                    durationUnit
                };

                setPlaylist(prev => [...prev, track]);
                setAutomationNotice(`${selectedPad.note} aan de tijdlijn toegevoegd.`);
            };

            const finishAutomation = () => {
                if (!automationRunRef.current) return;
                automationRunRef.current = false;
                setAutomationRunning(false);
                setAutomationActive([]);
                setAutomationNotice('Automatisering voltooid.');
                if (automationElapsedTimerRef.current) {
                    window.clearInterval(automationElapsedTimerRef.current);
                    automationElapsedTimerRef.current = null;
                }
                automationTimersRef.current.clear();
            };

            const stopAutomation = () => {
                automationRunRef.current = false;
                automationTimersRef.current.forEach(cancel => cancel());
                automationTimersRef.current.clear();
                automationVoicesRef.current.forEach(({ freq, voice }) => stopVoice(freq, voice));
                automationVoicesRef.current.clear();
                setAutomationRunning(false);
                setAutomationActive([]);
                setAutomationElapsed(0);
                setAutomationNotice('Automatisering gestopt.');
                if (automationElapsedTimerRef.current) {
                    window.clearInterval(automationElapsedTimerRef.current);
                    automationElapsedTimerRef.current = null;
                }
            };

            const startAutomation = () => {
                if (!engineStarted || automationRunning || playlist.length === 0) return;

                const invalidTrack = playlist.find(track => trackDuurSeconden(track) <= 0);
                if (invalidTrack) {
                    setAutomationNotice('Elke track heeft een duur nodig die groter is dan nul.');
                    return;
                }

                initAudioEngine();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                automationRunRef.current = true;
                automationPendingRef.current = playlist.length;
                automationStartedAtRef.current = performance.now();
                setAutomationRunning(true);
                setAutomationElapsed(0);
                setAutomationActive([]);
                setAutomationNotice('Automatisering actief. Overlappende tracks zijn tegelijk actief.');

                automationElapsedTimerRef.current = window.setInterval(() => {
                    if (automationRunRef.current) {
                        setAutomationElapsed((performance.now() - automationStartedAtRef.current) / 1000);
                    }
                }, 1000);

                playlist.forEach(track => {
                    const startDelayMs = trackStartSeconden(track) * 1000;
                    const durationMs = trackDuurSeconden(track) * 1000;
                    const cancelStart = scheduleLongTimer(startDelayMs, () => {
                        if (!automationRunRef.current) return;

                        const voice = playFrequentie(track.freq);
                        automationVoicesRef.current.set(track.id, { freq: track.freq, voice });
                        setAutomationActive(prev => [...prev, track.id]);

                        const cancelStoppen = scheduleLongTimer(durationMs, () => {
                            stopVoice(track.freq, voice);
                            automationVoicesRef.current.delete(track.id);
                            setAutomationActive(prev => prev.filter(id => id !== track.id));
                            automationPendingRef.current -= 1;
                            if (automationPendingRef.current <= 0) finishAutomation();
                        });
                        automationTimersRef.current.set(`${track.id}-stop`, cancelStoppen);
                    });
                    automationTimersRef.current.set(`${track.id}-start`, cancelStart);
                });
            };

            useEffect(() => () => {
                automationRunRef.current = false;
                automationTimersRef.current.forEach(cancel => cancel());
                automationTimersRef.current.clear();
                automationVoicesRef.current.forEach(({ freq, voice }) => stopVoice(freq, voice));
                automationVoicesRef.current.clear();
                if (automationElapsedTimerRef.current) window.clearInterval(automationElapsedTimerRef.current);
                Object.keys(manualVoicesRef.current).forEach(freq => stopVoice(freq, manualVoicesRef.current[freq]));
                manualVoicesRef.current = {};
            }, []);

            const isAnyPlaying = Object.values(activeKeys).some(val => val) || automationActive.length > 0;

            return (
                <div className="flex flex-col min-h-screen py-10 px-4 md:px-8 max-w-6xl mx-auto w-full">
                    
                    {/* HEADER */}
                    <header className="text-center mb-10">
                        <div className="inline-flex items-center justify-center w-16 h-16 rounded-full border border-synth-cyan/50 bg-synth-cyan/10 mb-4 shadow-[0_0_20px_rgba(0,240,255,0.3)]">
                            <i className="ph-thin ph-wave-sine text-4xl text-synth-cyan"></i>
                        </div>
                        <h1 className="font-display text-4xl md:text-5xl font-black mb-2 tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-synth-cyan via-synth-purple to-synth-gold">
                            OPUS AETERNA
                        </h1>
                        <p className="font-mono text-xs md:text-sm text-gray-400 uppercase tracking-[0.3em]">
                            Solfeggio-quantumsynthesizer
                        </p>
                    </header>

                    {!engineStarted ? (
                        <div className="flex-1 flex flex-col items-center justify-center animate-[fadeIn_0.5s_ease-out]">
                            <div className="glass-panel p-10 rounded-3xl text-center max-w-lg border-t-2 border-synth-cyan">
                                <i className="ph-fill ph-headphones text-6xl text-synth-cyan mb-6 animate-bounce"></i>
                                <h2 className="font-display text-2xl font-bold text-white mb-4">START DE GELUIDERVARING</h2>
                                <p className="text-gray-400 mb-8 font-light leading-relaxed">
                                    Deze experimentele module genereert in realtime zuivere sinusvormige geluidsgolven. De module doet geen medische of therapeutische claims en is geen medische behandeling. Gebruik een comfortabel volume en stop met luisteren als u ongemak ervaart.
                                </p>
                                <button 
                                    onClick={startEngine}
                                    className="px-10 py-4 bg-gradient-to-r from-synth-cyan to-synth-purple text-white font-bold rounded-full uppercase tracking-widest shadow-[0_0_30px_rgba(176,38,255,0.5)] hover:scale-105 transition duration-300"
                                >
                                    OSCILLATOREN INSCHAKELEN
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="flex-1 flex flex-col animate-[fadeIn_0.8s_ease-out]">
                            
                            {/* VISUALIZER */}
                            <div className="glass-panel p-6 rounded-3xl mb-8 flex flex-col items-center justify-center min-h-[150px] border-t border-synth-purple/40">
                                <div className="text-[10px] font-mono text-gray-500 uppercase tracking-[0.2em] mb-4">ACTIEF FREQUENTIESPECTRUM</div>
                                <div className="wave-container">
                                    {Array.from({length: 15}).map((_, i) => (
                                        <div key={i} className={`wave-bar ${isAnyPlaying ? 'playing' : ''}`}></div>
                                    ))}
                                </div>
                            </div>

                            {/* INSTRUCTIONS */}
                            <div className="text-center mb-8 font-mono text-xs text-gray-400">
                                <span className="hidden md:inline">Druk op de toetsen (A, S, D, F, G, H, J) op uw toetsenbord om af te spelen. <br/></span>
                                U kunt meerdere frequenties tegelijk afspelen (polyfonie).
                            </div>

                            {/* KEYBOARD / PADS */}
                            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 md:gap-6">
                                {FREQUENCIES.map((pad) => (
                                    <div 
                                        key={pad.freq}
                                        onMouseDown={() => handlePadDown(pad.freq)}
                                        onMouseUp={() => handlePadUp(pad.freq)}
                                        onMouseLeave={() => handlePadUp(pad.freq)}
                                        onTouchStart={(e) => { e.preventDefault(); handlePadDown(pad.freq); }}
                                        onTouchEnd={(e) => { e.preventDefault(); handlePadUp(pad.freq); }}
                                        className={`pad-key flex flex-col items-center justify-between p-4 md:p-6 rounded-2xl border cursor-pointer select-none h-40 md:h-56 ${activeKeys[pad.freq] ? 'active' : 'bg-synth-panel/80 border-gray-700/50 hover:bg-gray-800'}`}
                                        style={{ color: pad.color }}
                                    >
                                        <div className="text-center">
                                            <div className="font-display font-bold text-2xl md:text-3xl mb-1">{pad.freq}</div>
                                            <div className="font-mono text-[9px] uppercase tracking-widest text-white/50">Hz</div>
                                        </div>
                                        
                                        <div className="text-center flex-1 flex flex-col justify-center my-2">
                                            <div className="text-white font-bold text-sm mb-1">{pad.note}</div>
                                            <div className="text-[9px] md:text-[10px] text-gray-400 leading-tight">{pad.objective}</div>
                                        </div>

                                        <div className="hidden md:flex w-8 h-8 rounded border border-current items-center justify-center font-mono font-bold text-white/70">
                                            {pad.key.toUpperCase()}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* AUTOMATION LAB */}
                            <section className="glass-panel mt-10 p-6 md:p-8 rounded-3xl border-t-2 border-synth-purple/50">
                                <div className="flex flex-col md:flex-row md:items-start md:justify-between gap-4 mb-8">
                                    <div>
                                        <div className="text-[10px] font-mono text-synth-cyan uppercase tracking-[0.25em] mb-3">AUTOMATISERINGSLAB</div>
                                        <h2 className="font-display text-xl md:text-2xl font-bold text-white mb-3">Bouw een handsfree sessie</h2>
                                        <p className="text-sm text-gray-400 leading-relaxed max-w-2xl">
                                            Programmeer elke frequentie in seconden, minuten of uren. Tracks met dezelfde starttijd spelen samen, terwijl overlappende tracks hun eigen duur behouden.
                                        </p>
                                    </div>
                                    <div className="shrink-0 px-3 py-2 rounded-full border border-synth-purple/40 text-[10px] font-mono text-gray-400 uppercase tracking-widest">
                                        {playlist.length} {playlist.length === 1 ? 'Track' : 'Tracks'}
                                    </div>
                                </div>

                                <div className="grid lg:grid-cols-[minmax(0,0.85fr)_minmax(0,1.15fr)] gap-8">
                                    <div className="space-y-5">
                                        <div className="text-[10px] font-mono text-gray-500 uppercase tracking-[0.2em]">Een frequentie toevoegen</div>

                                        <label className="block text-xs font-mono text-gray-400 uppercase tracking-widest">
                                            Frequentie
                                            <select
                                                value={selectedFrequentie}
                                                onChange={(e) => setSelectedFrequentie(Number(e.target.value))}
                                                className="mt-2 w-full rounded-lg border border-gray-700 bg-black/30 px-3 py-3 text-sm text-white outline-none focus:border-synth-cyan"
                                            >
                                                {FREQUENCIES.map((pad) => (
                                                    <option key={pad.freq} value={pad.freq}>{pad.freq} Hz - {pad.note}</option>
                                                ))}
                                            </select>
                                        </label>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <label className="block text-xs font-mono text-gray-400 uppercase tracking-widest">
                                                Start na
                                                <div className="mt-2 flex gap-2">
                                                    <input
                                                        type="number"
                                                        min="0"
                                                        step="any"
                                                        inputMode="decimal"
                                                        value={startValue}
                                                        onChange={(e) => setStartValue(e.target.value)}
                                                        className="min-w-0 w-full rounded-lg border border-gray-700 bg-black/30 px-3 py-3 text-sm text-white outline-none focus:border-synth-cyan"
                                                    />
                                                    <select
                                                        value={startUnit}
                                                        onChange={(e) => setStartUnit(e.target.value)}
                                                        className="w-28 rounded-lg border border-gray-700 bg-black/30 px-2 py-3 text-xs text-white outline-none focus:border-synth-cyan"
                                                    >
                                                        <option value="seconds">Seconden</option>
                                                        <option value="minutes">Minuten</option>
                                                        <option value="hours">Uren</option>
                                                    </select>
                                                </div>
                                            </label>

                                            <label className="block text-xs font-mono text-gray-400 uppercase tracking-widest">
                                                Duur
                                                <div className="mt-2 flex gap-2">
                                                    <input
                                                        type="number"
                                                        min="0.1"
                                                        step="any"
                                                        inputMode="decimal"
                                                        value={durationValue}
                                                        onChange={(e) => setDuurValue(e.target.value)}
                                                        className="min-w-0 w-full rounded-lg border border-gray-700 bg-black/30 px-3 py-3 text-sm text-white outline-none focus:border-synth-cyan"
                                                    />
                                                    <select
                                                        value={durationUnit}
                                                        onChange={(e) => setDuurUnit(e.target.value)}
                                                        className="w-28 rounded-lg border border-gray-700 bg-black/30 px-2 py-3 text-xs text-white outline-none focus:border-synth-cyan"
                                                    >
                                                        <option value="seconds">Seconden</option>
                                                        <option value="minutes">Minuten</option>
                                                        <option value="hours">Uren</option>
                                                    </select>
                                                </div>
                                            </label>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <button
                                                onClick={() => addTrack(false)}
                                                className="flex items-center justify-center gap-2 rounded-lg bg-gradient-to-r from-synth-cyan to-synth-purple px-4 py-3 text-xs font-bold uppercase tracking-widest text-white shadow-[0_0_22px_rgba(176,38,255,0.25)] transition hover:scale-[1.02]"
                                            >
                                                <i className="ph-bold ph-plus"></i>
                                                Aan tijdlijn toevoegen
                                            </button>
                                            <button
                                                onClick={() => addTrack(true)}
                                                className="flex items-center justify-center gap-2 rounded-lg border border-synth-purple/50 px-4 py-3 text-xs font-bold uppercase tracking-widest text-white transition hover:bg-synth-purple/10"
                                            >
                                                <i className="ph-bold ph-arrow-line-down"></i>
                                                Volgende toevoegen
                                            </button>
                                        </div>

                                        <p className="text-[11px] leading-relaxed text-gray-500">
                                            Gebruik dezelfde starttijd voor een akkoordachtige laag. Gebruik <span className="text-gray-300">Volgende toevoegen</span> om een track na de huidige tijdlijn te plaatsen.
                                        </p>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between gap-4">
                                            <div className="text-[10px] font-mono text-gray-500 uppercase tracking-[0.2em]">Sessietijdlijn</div>
                                            <div className="text-[10px] font-mono text-synth-gold uppercase tracking-widest">{formatDuur(geplandDuurSeconden)} gepland</div>
                                        </div>

                                        {playlist.length === 0 ? (
                                            <div className="rounded-xl border border-dashed border-gray-700/70 px-5 py-8 text-center text-sm text-gray-500">
                                                Uw tijdlijn is leeg. Voeg een of meer frequenties toe om te beginnen.
                                            </div>
                                        ) : (
                                            <div className="space-y-3 max-h-[520px] overflow-y-auto pr-1">
                                                {playlist.map((track, index) => {
                                                    const pad = getPad(track.freq);
                                                    const isLive = automationActive.includes(track.id);
                                                    return (
                                                        <div key={track.id} className="rounded-xl border bg-black/20 p-4" style={{ borderColor: `${pad.color}55` }}>
                                                            <div className="flex items-start justify-between gap-3">
                                                                <div className="flex min-w-0 items-center gap-3">
                                                                    <span className="h-3 w-3 shrink-0 rounded-full" style={{ backgroundColor: pad.color, boxShadow: `0 0 12px ${pad.color}` }}></span>
                                                                    <div className="min-w-0">
                                                                        <div className="truncate text-sm font-bold text-white">{index + 1}. {pad.freq} Hz · {pad.note}</div>
                                                                        <div className="mt-1 text-[10px] font-mono uppercase tracking-wider text-gray-500">
                                                                            Start {formatDuur(trackStartSeconden(track))} · Duurt {formatDuur(trackDuurSeconden(track))}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                                <div className="flex shrink-0 items-center gap-2">
                                                                    {isLive && <span className="rounded-full border border-synth-cyan/50 px-2 py-1 text-[9px] font-mono uppercase tracking-widest text-synth-cyan">Live</span>}
                                                                    <button
                                                                        onClick={() => removeTrack(track.id)}
                                                                        disabled={automationRunning}
                                                                        aria-label={`Remove ${pad.note}`}
                                                                        title="Track verwijderen"
                                                                        className="flex h-8 w-8 items-center justify-center rounded-lg border border-gray-700 text-gray-400 transition hover:border-red-400 hover:text-red-300 disabled:cursor-not-allowed disabled:opacity-30"
                                                                    >
                                                                        <i className="ph-bold ph-trash"></i>
                                                                    </button>
                                                                </div>
                                                            </div>

                                                            <div className="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                                <label className="block text-[10px] font-mono uppercase tracking-widest text-gray-500">
                                                                    Start na
                                                                    <div className="mt-2 flex gap-2">
                                                                        <input
                                                                            type="number"
                                                                            min="0"
                                                                            step="any"
                                                                            value={track.startValue}
                                                                            onChange={(e) => updateTrack(track.id, 'startValue', e.target.value)}
                                                                            disabled={automationRunning}
                                                                            className="min-w-0 w-full rounded-lg border border-gray-700 bg-black/30 px-2 py-2 text-xs text-white outline-none focus:border-synth-cyan disabled:opacity-50"
                                                                        />
                                                                        <select
                                                                            value={track.startUnit}
                                                                            onChange={(e) => updateTrack(track.id, 'startUnit', e.target.value)}
                                                                            disabled={automationRunning}
                                                                            className="w-24 rounded-lg border border-gray-700 bg-black/30 px-1 py-2 text-[10px] text-white outline-none focus:border-synth-cyan disabled:opacity-50"
                                                                        >
                                                                            <option value="seconds">Seconden</option>
                                                                            <option value="minutes">Minuten</option>
                                                                            <option value="hours">Uren</option>
                                                                        </select>
                                                                    </div>
                                                                </label>
                                                                <label className="block text-[10px] font-mono uppercase tracking-widest text-gray-500">
                                                                    Duur
                                                                    <div className="mt-2 flex gap-2">
                                                                        <input
                                                                            type="number"
                                                                            min="0.1"
                                                                            step="any"
                                                                            value={track.durationValue}
                                                                            onChange={(e) => updateTrack(track.id, 'durationValue', e.target.value)}
                                                                            disabled={automationRunning}
                                                                            className="min-w-0 w-full rounded-lg border border-gray-700 bg-black/30 px-2 py-2 text-xs text-white outline-none focus:border-synth-cyan disabled:opacity-50"
                                                                        />
                                                                        <select
                                                                            value={track.durationUnit}
                                                                            onChange={(e) => updateTrack(track.id, 'durationUnit', e.target.value)}
                                                                            disabled={automationRunning}
                                                                            className="w-24 rounded-lg border border-gray-700 bg-black/30 px-1 py-2 text-[10px] text-white outline-none focus:border-synth-cyan disabled:opacity-50"
                                                                        >
                                                                            <option value="seconds">Seconden</option>
                                                                            <option value="minutes">Minuten</option>
                                                                            <option value="hours">Uren</option>
                                                                        </select>
                                                                    </div>
                                                                </label>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="mt-8 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 border-t border-white/5 pt-6">
                                    <div>
                                        <div className="text-[10px] font-mono uppercase tracking-[0.2em] text-gray-500">Sessiestatus</div>
                                        <div className="mt-1 text-sm text-gray-300">
                                            {automationRunning ? `Bezig gedurende ${formatDuur(automationElapsed)}` : 'Klaar wanneer u dat bent.'}
                                        </div>
                                    </div>
                                    <div className="flex flex-wrap gap-3">
                                        <button
                                            onClick={startAutomation}
                                            disabled={automationRunning || playlist.length === 0}
                                            className="flex items-center justify-center gap-2 rounded-lg bg-synth-cyan px-4 py-3 text-xs font-bold uppercase tracking-widest text-synth-dark transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-30"
                                        >
                                            <i className="ph-bold ph-play"></i>
                                            Automatisering starten
                                        </button>
                                        <button
                                            onClick={stopAutomation}
                                            disabled={!automationRunning}
                                            className="flex items-center justify-center gap-2 rounded-lg border border-synth-active/60 px-4 py-3 text-xs font-bold uppercase tracking-widest text-synth-active transition hover:bg-synth-active/10 disabled:cursor-not-allowed disabled:opacity-30"
                                        >
                                            <i className="ph-bold ph-stop"></i>
                                            Stoppen
                                        </button>
                                        <button
                                            onClick={clearPlaylist}
                                            disabled={automationRunning || playlist.length === 0}
                                            aria-label="Tijdlijn wissen"
                                            title="Tijdlijn wissen"
                                            className="flex h-11 w-11 items-center justify-center rounded-lg border border-gray-700 text-gray-400 transition hover:border-gray-400 hover:text-white disabled:cursor-not-allowed disabled:opacity-30"
                                        >
                                            <i className="ph-bold ph-broom"></i>
                                        </button>
                                    </div>
                                </div>

                                {automationNotice && (
                                    <div className="mt-4 rounded-lg border border-synth-purple/30 bg-synth-purple/5 px-4 py-3 text-center text-xs text-gray-300">
                                        {automationNotice}
                                    </div>
                                )}
                            </section>

                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="mt-12 pt-6 text-center text-[10px] font-mono text-gray-600 tracking-[0.2em] uppercase border-t border-white/5">
                        Vrije geluidsarchitectuur <br/>
                        Aangedreven door Infiniti IA & Invictus Maximus
                    </footer>

                </div>
            );
        };

        const root = ReactDOM.createWortel(document.getElementById('root'));
        root.render(<SynthApp />);
    </script>
</body>
</html>
